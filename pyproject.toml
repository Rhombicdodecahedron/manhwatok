[project]
name = "manhwatok"
version = "0.1.0"
description = "Themed manhwa recommendation slideshows for TikTok accounts"
readme = "README.md"
authors = [
    { name = "Alexis Stella", email = "alexis.stella@apexlogic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pillow>=10",
    "pydantic>=2.7",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
manhwatok = "manhwatok.cli:app"

[project.optional-dependencies]
upload = [
    "playwright>=1.45",
]
tui = [
    "textual>=1.0",
    "textual-image>=0.8",
]
pinterest = [
    "gallery-dl>=1.27",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: drives a real headless Chromium against local fixture pages (needs the upload extra)",
]
