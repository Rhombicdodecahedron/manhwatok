<!doctype html>
<!-- Stands in for TikTok's upload page in tests/browser; it follows the selectors in
     src/manhwatok/adapters/tiktok_page.py. Query-string flags: ?no-input (no file input),
     ?no-editor (the editor never opens), ?no-caption (the editor has no description box),
     ?no-title (no title box), ?no-hashtags (a typed hashtag is never suggested as such),
     ?no-sounds (a sound search finds nothing), ?no-schedule (no "When to post" at all),
     ?consent (the one-time "allow scheduled posting" modal opens and the radio stays on Now),
     ?month-only (the calendar shows one month at a time, so the next-month arrow is needed),
     ?stuck-date (picking a day leaves the date box as it was),
     ?no-visibility (no "Who can see this post" at all),
     ?visible-to=<label> (the list starts on that option instead of Everyone),
     ?stuck-visibility (picking an option leaves the trigger reading what it read before).
     "Today" for the calendar is 2026-09-22, as on the day the real page was read. -->
<html lang="en">
<head><meta charset="utf-8"><title>Upload</title>
<style>.tiktok-timepicker-invisible { display: none; }</style></head>
<body>
  <!-- Hidden editable text before the editor, as real pages have; it must not count. -->
  <div contenteditable="true" hidden>not the caption</div>
  <main>
    <button type="button" onclick="document.querySelector('input[type=file]').click()">Select files</button>
    <input type="file" accept="image/*" multiple hidden>
  </main>
  <section id="editor" hidden>
    <ol id="files"></ol>
    <input class="titleInput-x1" placeholder="Add a catchy title" value="IMG_0001">
    <div class="caption-editor"><div contenteditable="true">01.png</div></div>
    <!-- TikTok lists hashtags while one is typed; picking one inserts it and a space. -->
    <div id="hashtags" hidden></div>
    <button type="button" id="add-sound">Add sound</button>
    <div id="sounds" hidden>
      <input placeholder="Search sounds">
      <div class="MusicPanelTabListMusicList__list">
        <div role="listitem"><div class="MusicPanelMusicItem__infoBasicTitle">For You pick</div><button type="button">Use</button></div>
      </div>
      <div id="results"></div>
    </div>
    <!-- "When to post": the radio pair, then the two readonly pickers once Schedule is on. -->
    <div data-e2e="schedule_container">
      <div class="scheduled-container new-form">
        <div class="title-v2 scheduled-title-container"><span class="TUXText">When to post</span></div>
        <div class="schedule-radio-container">
          <label class="Radio__root Radio__root--disabled-false">
            <span class="Radio__circle Radio__circle--checked-true">
              <input type="radio" class="Radio__input" name="postSchedule" value="post_now" aria-checked="true" checked>
              <span class="Radio__innerCircle Radio__innerCircle--checked-true"></span>
            </span>
            <span class="TUXText">Now</span>
          </label>
          <label class="Radio__root Radio__root--disabled-false">
            <span class="Radio__circle Radio__circle--checked-false">
              <input type="radio" class="Radio__input" name="postSchedule" value="schedule" aria-checked="false">
              <span class="Radio__innerCircle Radio__innerCircle--checked-false"></span>
            </span>
            <span class="TUXText">Schedule</span>
          </label>
        </div>
        <div class="scheduled-picker" hidden>
          <div class="TUXFormField TUXTextInput">
            <input class="TUXTextInputCore-input" type="text" readonly value="23:20">
          </div>
          <div class="tiktok-timepicker-time-picker-container tiktok-timepicker-invisible">
            <div class="tiktok-timepicker-option-list" id="hours"></div>
            <div class="tiktok-timepicker-option-list" id="minutes"></div>
          </div>
          <div class="TUXFormField TUXTextInput">
            <input class="TUXTextInputCore-input" type="text" readonly value="2026-09-22">
          </div>
          <div class="calendar-wrapper" hidden>
            <div class="calendar-header">
              <span class="arrow" id="previous-month">‹</span>
              <span class="month-title"></span>
              <span class="year-title"></span>
              <span class="arrow" id="next-month">›</span>
            </div>
            <div class="calendar-days" id="days"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- "Who can see this post", in the same card under the schedule. Its options are not
         here: they open in a popup of their own, outside this container (see #visibility). -->
    <div data-e2e="video_visibility_container" class="visibility-wrapper">
      <div class="title-wrapper"><span class="TUXText">Who can see this post</span></div>
      <div class="Select__root">
        <button type="button" role="combobox" aria-expanded="false" aria-haspopup="dialog"
                data-open="false" class="Select__trigger Select__trigger--variant-fill">
          <div class="Select__triggerInner"><div>Everyone</div></div>
          <span class="px-icon Select__openIndicator" data-icon="ArrowDown"></span>
        </button>
      </div>
    </div>
    <!-- Reads "Schedule" once the radio moved; manhwatok never clicks either. -->
    <button type="button" data-e2e="post_video_button" onclick="document.body.dataset.posted = 'yes'">Post</button>
  </section>
  <!-- The visibility options: a popup outside the container above, so they can only be found
       from the page. Their data-value is not in display order, and "Friends" has a second
       line of its own. -->
  <div id="visibility" role="dialog" hidden>
    <div role="listbox">
      <div role="option" id="option-&quot;0&quot;" class="Select__item" data-value="&quot;0&quot;"
           aria-selected="true" data-selected="true"><span class="TUXText">Everyone</span></div>
      <div role="option" id="option-&quot;2&quot;" class="Select__item" data-value="&quot;2&quot;"
           aria-selected="false" data-selected="false"><span class="TUXText">Friends</span>
        <span class="TUXText">Followers you follow back</span></div>
      <div role="option" id="option-&quot;1&quot;" class="Select__item" data-value="&quot;1&quot;"
           aria-selected="false" data-selected="false"><span class="TUXText">Only you</span></div>
    </div>
  </div>
  <div id="consent" hidden>
    <p>Allow your video to be saved for scheduled posting? When you schedule a video, the video
      is saved on our servers before it is posted.</p>
    <button type="button" id="cancel">Cancel</button>
    <button type="button" id="allow">Allow</button>
  </div>
  <script>
    const flags = new URLSearchParams(location.search);
    if (flags.has("no-input")) document.querySelector("input[type=file]").remove();
    if (flags.has("no-caption")) document.querySelector(".caption-editor").remove();
    if (flags.has("no-title")) document.querySelector(".titleInput-x1").remove();
    const input = document.querySelector("input[type=file]");
    input?.addEventListener("change", () => {
      for (const file of input.files) {
        const item = document.createElement("li");
        item.textContent = file.name;
        document.getElementById("files").append(item);
      }
      // TikTok takes a moment to process the files before it shows the editor.
      if (!flags.has("no-editor")) {
        setTimeout(() => { document.getElementById("editor").hidden = false; }, 100);
      }
    });

    const picked = [];
    const list = document.getElementById("hashtags");
    document.querySelector(".caption-editor [contenteditable]")?.addEventListener("input", (e) => {
      const typed = e.currentTarget.innerText.match(/#([^\s#]+)$/);
      if (!typed) { list.hidden = true; return; }
      const tag = "#" + typed[1].toLowerCase();
      const topics = flags.has("no-hashtags") ? [tag + "x"] : [tag + "x", tag];
      list.replaceChildren(...topics.map((topic) => {
        const option = document.createElement("div");
        option.className = "hashtag-suggestion-item";
        option.innerHTML = `<span class="hash-tag-topic"></span><span>1K posts</span>`;
        option.firstChild.textContent = topic;
        option.onmousedown = (event) => event.preventDefault();  // keep the caret in the box
        option.onclick = () => {
          picked.push(topic);
          document.body.dataset.hashtags = picked.join(" ");
          document.execCommand("insertText", false, " ");
          list.hidden = true;
        };
        return option;
      }));
      list.hidden = false;
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { list.hidden = true; document.body.dataset.escaped = "yes"; }
    });

    const sounds = document.getElementById("sounds");
    document.getElementById("add-sound").onclick = () => { sounds.hidden = false; };
    sounds.querySelector("input").addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const query = e.currentTarget.value;
      setTimeout(() => {
        const results = document.getElementById("results");
        results.className = "MusicPanelSearchResultList__list";
        results.replaceChildren();
        if (flags.has("no-sounds")) return;
        for (const n of [1, 2]) {
          const item = document.createElement("div");
          item.setAttribute("role", "listitem");
          item.innerHTML = `<div class="MusicPanelMusicItem__infoBasicTitle"></div>
            <div class="MusicPanelMusicItem__infoBasicDesc">00:3${n} · Fixture</div>
            <button type="button">Use</button>`;
          item.firstChild.textContent = `${query} ${n}`;
          item.querySelector("button").onclick = () => {
            document.body.dataset.sound = `${query} ${n}`;
            sounds.hidden = true;
          };
          results.append(item);
        }
      }, 100);
    });

    // --- "When to post" ------------------------------------------------------------------
    // TikTok's own radio is driven by React: the browser's label behaviour is turned off here
    // too, and only a click on the label's text switches it.
    const schedule = document.querySelector('[data-e2e="schedule_container"]');
    if (flags.has("no-schedule")) schedule.remove();
    const TODAY = new Date(2026, 8, 22);          // 22 September 2026, as the page was read
    const WINDOW_DAYS = 11;                        // today plus 11 days are pickable
    const picker = schedule?.querySelector(".scheduled-picker");
    const boxes = schedule?.querySelectorAll(".TUXTextInputCore-input");
    const timeBox = boxes?.[0], dateBox = boxes?.[1];
    const times = schedule?.querySelector(".tiktok-timepicker-time-picker-container");
    const calendar = schedule?.querySelector(".calendar-wrapper");
    const consent = document.getElementById("consent");
    let allowed = !flags.has("consent");
    let view = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);

    const pad = (n) => String(n).padStart(2, "0");
    const isoDay = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

    function setChecked(value) {
      for (const input of schedule.querySelectorAll('input[name="postSchedule"]')) {
        const on = input.value === value;
        input.setAttribute("aria-checked", String(on));
        input.checked = on;
        input.parentElement.className = `Radio__circle Radio__circle--checked-${on}`;
      }
      picker.hidden = value !== "schedule";
      document.querySelector('[data-e2e="post_video_button"]').textContent =
        value === "schedule" ? "Schedule" : "Post";
    }

    for (const label of schedule?.querySelectorAll("label") ?? []) {
      label.addEventListener("click", (event) => {
        event.preventDefault();                    // React decides, not the browser
        if (!event.target.classList.contains("TUXText")) return;  // only the label's text works
        const value = label.querySelector("input").value;
        if (value === "schedule" && !allowed) { consent.hidden = false; return; }
        setChecked(value);
      });
    }
    document.getElementById("allow")?.addEventListener("click", () => {
      allowed = true;
      consent.hidden = true;
      document.body.dataset.allowed = "yes";
      setChecked("schedule");
    });

    // The time picker: hours, then minutes in 5-minute steps. Like TikTok, the boxes keep
    // their value attribute — only the live value changes.
    const options = (list, values) => {
      list.replaceChildren(...values.map((value) => {
        const item = document.createElement("span");
        item.className = "tiktok-timepicker-option-item";
        item.textContent = value;
        item.onclick = () => {
          const [hour, minute] = timeBox.value.split(":");
          timeBox.value = list.id === "hours" ? `${value}:${minute}` : `${hour}:${value}`;
        };
        return item;
      }));
    };
    if (schedule) {
      options(document.getElementById("hours"), [...Array(24).keys()].map(pad));
      options(document.getElementById("minutes"), [...Array(12).keys()].map((n) => pad(n * 5)));
      timeBox.addEventListener("click", () => {
        times.classList.remove("tiktok-timepicker-invisible");
      });
      dateBox.addEventListener("click", () => { calendar.hidden = false; drawDays(); });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") times.classList.add("tiktok-timepicker-invisible");
      });
      document.getElementById("previous-month").onclick = () => { stepMonth(-1); };
      document.getElementById("next-month").onclick = () => { stepMonth(1); };
    }

    // --- "Who can see this post" ----------------------------------------------------------
    // The trigger opens the popup; picking an option closes it and writes its first line into
    // the trigger. Nothing here is touched unless manhwatok clicks it.
    const visibility = document.querySelector('[data-e2e="video_visibility_container"]');
    const popup = document.getElementById("visibility");
    if (flags.has("no-visibility")) { visibility.remove(); popup.remove(); }
    const trigger = visibility?.querySelector("button[role=combobox]");
    const chosen = trigger?.querySelector(".Select__triggerInner div");
    const labelOf = (option) => option.querySelector(".TUXText").textContent;

    function setVisibility(label) {
      chosen.textContent = label;
      for (const option of popup.querySelectorAll('[role="option"]')) {
        const on = labelOf(option) === label;
        option.setAttribute("aria-selected", String(on));
        option.dataset.selected = String(on);
      }
    }
    if (trigger) {
      if (flags.has("visible-to")) setVisibility(flags.get("visible-to"));
      trigger.onclick = () => {
        popup.hidden = false;
        trigger.setAttribute("aria-expanded", "true");
        document.body.dataset.visibilityOpened = "yes";
      };
      for (const option of popup.querySelectorAll('[role="option"]')) {
        option.onclick = () => {
          const label = labelOf(option);
          if (!flags.has("stuck-visibility")) setVisibility(label);
          popup.hidden = true;
          trigger.setAttribute("aria-expanded", "false");
          document.body.dataset.visibility = label;
        };
      }
    }

    function stepMonth(by) {
      view = new Date(view.getFullYear(), view.getMonth() + by, 1);
      drawDays();
    }

    function drawDays() {
      const shown = [];
      const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
      for (let day = 1; day <= days; day++) {
        shown.push(new Date(view.getFullYear(), view.getMonth(), day));
      }
      if (!flags.has("month-only")) {
        // TikTok's grid runs on into the next month, so a day just after it is pickable too.
        for (let day = 1; day <= 6; day++) {
          shown.push(new Date(view.getFullYear(), view.getMonth() + 1, day));
        }
      }
      const last = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() + WINDOW_DAYS);
      calendar.querySelector(".month-title").textContent =
        view.toLocaleString("en-US", { month: "long" });
      calendar.querySelector(".year-title").textContent = String(view.getFullYear());
      document.getElementById("days").replaceChildren(...shown.map((date) => {
        const cell = document.createElement("div");
        cell.className = "day-span-container";
        const span = document.createElement("span");
        const valid = date >= TODAY && date <= last;
        span.className = valid ? "day valid" : "day";
        span.textContent = String(date.getDate());
        if (valid) {
          span.onclick = () => {
            if (!flags.has("stuck-date")) dateBox.value = isoDay(date);
            calendar.hidden = true;
          };
        }
        cell.append(span);
        return cell;
      }));
    }
  </script>
</body>
</html>
